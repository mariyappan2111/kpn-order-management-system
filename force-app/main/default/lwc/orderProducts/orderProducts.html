<template>
    <lightning-card title="Order Products" icon-name="standard:orders">
        <div slot="actions">
            <lightning-button
                variant="brand"
                label="Activate Order"
                title="Activate Order"
                icon-name="utility:approval"
                onclick={handleActivateOrder}
                disabled={isActivateDisabled}>
            </lightning-button>
        </div>
        <div class="slds-p-around_medium">

            <!-- Status Badge -->
            <template if:true={isOrderActivated}>
                <div class="slds-m-bottom_small">
                    <lightning-badge label="Order Activated" variant="success"></lightning-badge>
                </div>
            </template>

            <!-- Error Message -->
            <template if:true={error}>
                <div class="slds-text-color_error slds-m-bottom_small">
                    {error}
                </div>
            </template>

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading order items..."></lightning-spinner>
            </template>

            <!-- Order Items Table -->
            <template if:false={isLoading}>
                <template if:true={hasOrderItems}>
                    <lightning-datatable
                        key-field="orderItemId"
                        data={orderItems}
                        columns={columns}
                        hide-checkbox-column>
                    </lightning-datatable>

                    <!-- Total Summary -->
                    <div class="slds-grid slds-grid_align-end slds-m-top_medium">
                        <div class="slds-col slds-size_1-of-3">
                            <div class="slds-text-heading_medium slds-text-align_right">
                                Total:
                                <lightning-formatted-number
                                    value={totalAmount}
                                    format-style="currency"
                                    currency-code="EUR">
                                </lightning-formatted-number>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- No Products -->
                <template if:false={hasOrderItems}>
                    <div class="slds-text-align_center slds-text-color_weak slds-p-vertical_large">
                        No products added to this order yet.
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
