  /products/categories:
    get:
      summary: Get list of product categories
      operationId: getProductCategories
      responses:
        '200':
          description: Available product categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: MOBILE

components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [MOBILE, BROADBAND, ADDON]
        description:
          type: string
        price:
          type: number
          format: double
        currencytype:
          type: string
        isBundle:
          type: boolean
        components:
          type: array
          items:
            $ref: '#/components/schemas/ProductComponent'
        eligibility:
          type: object
          properties:
            minTenureMonths:
              type: integer
            requiresAddressValidation:
              type: boolean
            serviceAvailabilityArea:
              type: string
    ProductComponent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        included:
          type: boolean